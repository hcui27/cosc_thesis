<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vibe-coded site signature</title>
<style>
:root{--bg:#fcfcfb;--card:#fff;--ink:#0b0b0b;--ink2:#52514e;--line:#e4e3df;--accent:#2a78d6;--chip:#eef2f8}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a19;--card:#232321;--ink:#f0efec;--ink2:#c3c2b7;--line:#3a3a37;--accent:#3987e5;--chip:#2b2f36}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Helvetica,Arial,sans-serif}
header{padding:20px 24px 0;max-width:1200px;margin:auto}h1{margin:0 0 4px;font-size:22px}.sub{color:var(--ink2);margin:0 0 14px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line)}nav button{background:none;border:0;padding:10px 16px;font:inherit;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent}nav button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
main{max-width:1200px;margin:auto;padding:20px 24px 60px}.tab{display:none}.tab.on{display:block}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 16px}.stat b{display:block;font-size:22px}
img{max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}input{min-width:260px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:8px 0}summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center}summary .n{margin-left:auto;color:var(--ink2);white-space:nowrap}
.pill{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle}.body{padding:4px 16px 16px}.fam{font-size:17px;margin:22px 0 4px}.muted{color:var(--ink2)}
.val{border-top:1px solid var(--line);padding:10px 0}.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:1px 9px;font-size:12px;margin-right:6px}
.sheets{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.sheets img{max-width:560px;cursor:zoom-in}.ex{color:var(--ink2);font-size:13.5px;margin:4px 0}
table{border-collapse:collapse;width:100%;background:var(--card)}th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;font-size:14px}th{cursor:pointer;position:sticky;top:0;background:var(--card)}
#zoom{display:none;position:fixed;inset:0;background:#000d;z-index:9;align-items:center;justify-content:center;cursor:zoom-out}#zoom img{max-width:96vw;max-height:96vh;border:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}.card h4{margin:0 0 4px;font-size:21px;line-height:1.25}.card .obs{margin:0 0 8px;font-size:16.5px;line-height:1.4;font-weight:500}.card img{width:100%;margin-top:8px;cursor:zoom-in}
.acard{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:12px 0;padding:14px 16px}.acard h4{margin:0;font-size:16px;display:flex;gap:10px;align-items:center}.acard h4 .n{margin-left:auto;font-weight:400;color:var(--ink2);font-size:14px}.acard>img{width:100%;max-width:1100px;margin:10px 0;cursor:zoom-in}
pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px}
</style></head><body><header><h1>Vibe-coded site signature</h1><p class="sub">What a coding agent builds from a site's content and images, compared with the original. <span id="hs"></span></p>

<script>
const D={"n_sites": 28, "n_attributes": 133, "families": [{"family": "color", "summary": "AI-built pages almost always replace the original's color scheme with a different one (most often navy/blue or teal/green, with muted or deeper accent hues, off-white backgrounds, and darker, cooler text and link colors), usually organizing the page into alternating full-width tinted or dark section bands, with only isolated cases of added score coloring or dark-on-dark text that hides content.", "attributes": [{"id": "COL001", "attribute": "color palette", "summary": "Nearly every AI-built page changes the overall palette, most often to a navy/blue family, with teal/green, warm cream with orange or rust accents, and dark near-black schemes as the other common outcomes, and only one keeping the original brand palette.", "n_generated": 28, "n_diff": 28, "collage": "collages/COL001_color-palette-nearly-every-ai-built-page.png", "values": [{"value": "changed: palette becomes navy or blue family", "action": "changed", "n_generated": 12, "n_original": 12, "sites": ["aeptexas_com", "allstate_jobs", "bluebayou_com", "gravityvault_com", "greatdayimprovements_com", "homedesignersoftware_com", "insightcentral_net", "kneeguru_co_uk", "merchantsavvy_co_uk", "miamidda_com", "seoanalyzer_me", "stgpartners_com"], "example": "The original's body text is gray rgb(74,74,74), and its secondary bands are light gray rgb(243,243,243). The AI-built page's body text is navy-black rgb(28,39,51), and its secondary fills are pale blu", "sheets": []}, {"value": "changed: palette becomes teal or green family", "action": "changed", "n_generated": 7, "n_original": 7, "sites": ["alpine8848_com", "cbdoilcreamnk_com", "kanienkeha_net", "naturalwellbeing_com", "newclimateeconomy_net", "nira_org_ng", "thync_com"], "example": "Original's palette is navy text rgb(22,38,74), mid gray rgb(102,102,102), cyan links rgb(0,153,204), white panels and pale teal rgb(162,212,213). The AI-built page uses a teal family: dark teal rgb(31", "sheets": []}, {"value": "changed: palette becomes warm cream/off-white with navy, orange or rust accents", "action": "changed", "n_generated": 6, "n_original": 6, "sites": ["bather_com", "educationactivities_org", "flygrant_com", "neverskipbrunch_com", "tellmebaby_com_au", "thefrangipanicreative_com"], "example": "Both palettes are mostly neutral on a white body, but the colors differ. The original uses near-black rgb(28,27,27), grey text and a light-grey footer, with saturated color coming only from photograph", "sheets": []}, {"value": "changed: palette becomes dark or near-black", "action": "changed", "n_generated": 3, "n_original": 3, "sites": ["bathurst12hour_com_au", "fnsouzafoundation_com", "ridetech_com"], "example": "Both pages use a dark theme. Original: body background rgb(20,20,20), body text light grey rgb(204,204,204), panels in lighter greys rgb(34,34,34)/rgb(52,52,52)/rgb(58,58,58)/rgb(47,47,47). AI-built: ", "sheets": []}, {"value": "kept: original brand palette", "action": "kept", "n_generated": 1, "n_original": 1, "sites": ["bathurst12hour_com_au"], "example": "Both pages have a red, blue and charcoal palette that echoes the Liqui-Moly logo colours.", "sheets": []}]}, {"id": "COL002", "attribute": "text and link colors", "summary": "AI-built pages commonly standardise text and links, most often turning mid-grey or near-black body text into a darker, cooler tone with grey secondary copy, and making links underlined or recolored.", "n_generated": 24, "n_diff": 25, "collage": "collages/COL002_text-and-link-colors-ai-built-pages-comm.png", "values": [{"value": "changed: body text recolored to dark slate/navy/teal-black with grey secondary", "action": "changed", "n_generated": 7, "n_original": 7, "sites": ["allstate_jobs", "greatdayimprovements_com", "homedesignersoftware_com", "merchantsavvy_co_uk", "naturalwellbeing_com", "newclimateeconomy_net", "seoanalyzer_me"], "example": "Text colors differ. The original's body color is gray rgb(68,68,68), most text is near-black (25,25,25) on 742 elements, and secondary text is gray (107,119,137). The AI-built page uses dark slate (28", "sheets": []}, {"value": "changed: mid-grey body text becomes near-black with grey meta", "action": "changed", "n_generated": 6, "n_original": 6, "sites": ["educationactivities_org", "flygrant_com", "gravityvault_com", "kneeguru_co_uk", "merchantsavvy_co_uk", "ridetech_com"], "example": "Body text: both pages set body text at 16px. The original uses mid-grey rgb(96,96,96) with line-height 'normal' and near-black links rgb(27,27,27). The AI-built page uses near-black rgb(29,29,31) with", "sheets": []}, {"value": "changed: links become underlined", "action": "changed", "n_generated": 5, "n_original": 5, "sites": ["flygrant_com", "gravityvault_com", "homedesignersoftware_com", "kneeguru_co_uk", "naturalwellbeing_com"], "example": "Link styling differs. Original links are red Open Sans text (e.g. 'Keep reading…'), often paired with FontAwesome icons. AI-built links are underlined rust serif text with trailing '→' and '·' separat", "sheets": []}, {"value": "added: underlined links", "action": "added", "n_generated": 4, "n_original": 0, "sites": ["cbdoilcreamnk_com", "insightcentral_net", "nira_org_ng", "ridetech_com"], "example": "AI-built page makes whole category and wide image cards single links wrapping the image and caption, and underlines in-card and top-bar text links while leaving nav and footer links plain.", "sheets": []}, {"value": "changed: links become context-varied styles", "action": "changed", "n_generated": 3, "n_original": 3, "sites": ["aeptexas_com", "neverskipbrunch_com", "newclimateeconomy_net"], "example": "The original's inline links are blue rgb(0,120,170). The AI-built page underlines its links and colors them by context: white on navy and blue in the login card. Its nav links are not underlined.", "sheets": []}, {"value": "changed: link hue shifted", "action": "changed", "n_generated": 3, "n_original": 3, "sites": ["bathurst12hour_com_au", "bluebayou_com", "kanienkeha_net"], "example": "Original uses a light sky blue rgb(119,191,255) as its main link/accent colour on 90 elements: nav items, dates, footer links and the 'Featured News' tag. AI-built uses a mid blue rgb(59,139,224) on 2", "sheets": []}, {"value": "added: grey secondary copy color", "action": "added", "n_generated": 2, "n_original": 0, "sites": ["bathurst12hour_com_au", "fnsouzafoundation_com"], "example": "AI-built uses a grey rgb(166,166,171) for secondary copy such as excerpts and sub-labels (61 elements). Original has no comparable mid-grey secondary text colour among its top text colours.", "sheets": []}, {"value": "kept: underlined links", "action": "kept", "n_generated": 2, "n_original": 2, "sites": ["thefrangipanicreative_com", "thync_com"], "example": "Both pages underline their body links and color them crimson. Original uses rgb(178,3,50) and the AI-built page uses rgb(194,37,92).", "sheets": []}, {"value": "added: context-varied link styles", "action": "added", "n_generated": 1, "n_original": 0, "sites": ["tellmebaby_com_au"], "example": "Link styling in the AI-built page varies by context: bold undecorated nav links, underlined review titles, burnt-orange underlined 'more' links and underlined white footer links. Many cards are whole-", "sheets": []}, {"value": "added: light text and links on dark bands", "action": "added", "n_generated": 1, "n_original": 0, "sites": ["thefrangipanicreative_com"], "example": "The AI-built dark contact and footer areas use white, muted pink-white rgb(244,235,230) and light-pink link text, with small letter-spaced uppercase labels.", "sheets": []}, {"value": "dropped: inconsistent default/custom link blues", "action": "dropped", "n_generated": 0, "n_original": 1, "sites": [], "example": "Link text colors on the original are inconsistent: default browser blue (0,0,238) on 62 elements, a custom blue (24,132,184) on 134, and navy (35,35,87) on 27.", "sheets": []}]}, {"id": "COL003", "attribute": "section backgrounds", "summary": "Most AI-built pages break the page into alternating full-width section bands, typically white or cream alternating with pale tints or dark navy/slate bands, replacing plain white or the original's differing banding.", "n_generated": 23, "n_diff": 23, "collage": "collages/COL003_section-backgrounds-most-ai-built-pages.png", "values": [{"value": "changed: alternating bands including dark sections", "action": "changed", "n_generated": 8, "n_original": 8, "sites": ["aeptexas_com", "bathurst12hour_com_au", "cbdoilcreamnk_com", "flygrant_com", "naturalwellbeing_com", "neverskipbrunch_com", "tellmebaby_com_au", "thefrangipanicreative_com"], "example": "The original stacks mostly white sections with airy gaps, separated by thin light-gray bands. Its text is left-aligned; centered text appears only in the LED block and the red footer band. The AI-buil", "sheets": ["galleries/COL003_section-backgrounds/changed-alternating-bands-including-dark_p1.jpg", "galleries/COL003_section-backgrounds/changed-alternating-bands-including-dark_p2.jpg", "galleries/COL003_section-backgrounds/changed-alternating-bands-including-dark_p3.jpg"]}, {"value": "changed: alternating bands including navy sections", "action": "changed", "n_generated": 7, "n_original": 7, "sites": ["allstate_jobs", "bluebayou_com", "educationactivities_org", "gravityvault_com", "merchantsavvy_co_uk", "miamidda_com", "stgpartners_com"], "example": "Section separation differs. The original uses thin 1px light-cyan horizontal rules at column width between major sections. The AI-built page alternates full-bleed background bands instead: white, pale", "sheets": ["galleries/COL003_section-backgrounds/changed-alternating-bands-including-navy_p1.jpg", "galleries/COL003_section-backgrounds/changed-alternating-bands-including-navy_p2.jpg"]}, {"value": "changed: alternating light tinted bands", "action": "changed", "n_generated": 4, "n_original": 4, "sites": ["greatdayimprovements_com", "homedesignersoftware_com", "newclimateeconomy_net", "tellmebaby_com_au"], "example": "Page backgrounds differ. The original body is transparent over a sky-blue to white vertical gradient, with decorative swirls beside the hero. The AI-built page has a white body, and its sections alter", "sheets": ["galleries/COL003_section-backgrounds/changed-alternating-light-tinted-bands_p1.jpg", "galleries/COL003_section-backgrounds/changed-alternating-light-tinted-bands_p2.jpg"]}, {"value": "added: alternating light tinted bands", "action": "added", "n_generated": 3, "n_original": 0, "sites": ["nira_org_ng", "ridetech_com", "thync_com"], "example": "The AI-built page follows a regular vertical rhythm: 20px gutters between paired cards and about 45px between card rows. Its surfaces alternate subtly between rgb(246,249,247), white and rgb(250,252,2", "sheets": ["galleries/COL003_section-backgrounds/added-alternating-light-tinted-bands_p1.jpg"]}, {"value": "added: alternating bands including navy sections", "action": "added", "n_generated": 1, "n_original": 0, "sites": ["bather_com"], "example": "Image-and-text split sections alternate sides down the AI-built page (sustainability, Made in Canada, gift cards, ethos), along with alternating navy, white and beige backgrounds. The original has onl", "sheets": ["galleries/COL003_section-backgrounds/added-alternating-bands-including-navy-s_p1.jpg"]}, {"value": "kept: alternating white and grey bands", "action": "kept", "n_generated": 1, "n_original": 1, "sites": ["seoanalyzer_me"], "example": "Both pages use generous vertical whitespace between full-width bands that alternate white and grey backgrounds, separated by thin rules.", "sheets": ["galleries/COL003_section-backgrounds/kept-alternating-white-and-grey-bands_p1.jpg"]}]}, {"id": "COL004", "attribute": "accent color", "summary": "Most AI-built pages swap the original's accent hue for a different, usually more muted or deeper one (burnt orange, teal, indigo, gold), with a few reassigning or consolidating the accent role.", "n_generated": 13, "n_diff": 13, "collage": "collages/COL004_accent-color-most-ai-built-pages-swap-th.png", "values": [{"value": "changed: red accent replaced by a different hue (blue, orange, brick, gold, teal, indigo, green)", "action": "changed", "n_generated": 10, "n_original": 10, "sites": ["aeptexas_com", "cbdoilcreamnk_com", "educationactivities_org", "fnsouzafoundation_com", "gravityvault_com", "homedesignersoftware_com", "merchantsavvy_co_uk", "naturalwellbeing_com", "newclimateeconomy_net", "thync_com"], "example": "The original's main brand accent is red rgb(218,41,28): it appears on the login button, the hero h1, the rule under the header, the band above the footer, the play-arrow icons and the privacy link. Th", "sheets": ["galleries/COL004_accent-color/changed-red-accent-replaced-by-a-differe_p1.jpg", "galleries/COL004_accent-color/changed-red-accent-replaced-by-a-differe_p2.jpg"]}, {"value": "changed: accent role reassigned or consolidated into a single saturated accent", "action": "changed", "n_generated": 3, "n_original": 3, "sites": ["bathurst12hour_com_au", "ridetech_com", "thefrangipanicreative_com"], "example": "Original uses red rgb(237,28,36) as a secondary accent, limited to the active HOME nav underline and the small bars before headings. AI-built makes red rgb(228,32,46) the main accent, used on the '12 ", "sheets": ["galleries/COL004_accent-color/changed-accent-role-reassigned-or-consol_p1.jpg"]}]}, {"id": "COL005", "attribute": "page background", "summary": "Page backgrounds mostly shift to off-white or white from darker or saturated grounds, while a couple keep the original background.", "n_generated": 5, "n_diff": 5, "collage": "collages/COL005_page-background-page-backgrounds-mostly.png", "values": [{"value": "changed: background becomes off-white or white", "action": "changed", "n_generated": 3, "n_original": 3, "sites": ["kanienkeha_net", "newclimateeconomy_net", "thync_com"], "example": "The original's body background is near-black rgb(17,17,17), with a subtle texture at the top that turns flat at about y=900. The AI-built page's body background is measured as off-white rgb(251,252,25", "sheets": ["galleries/COL005_page-background/changed-background-becomes-off-white-or-_p1.jpg"]}, {"value": "kept: original background", "action": "kept", "n_generated": 2, "n_original": 2, "sites": ["aeptexas_com", "alpine8848_com"], "example": "Both pages use white rgb(255,255,255) as the body and dominant background.", "sheets": ["galleries/COL005_page-background/kept-original-background_p1.jpg"]}]}, {"id": "COL006", "attribute": "score colors", "summary": "A single page adds green, amber and red coloring to indicate scores.", "n_generated": 1, "n_diff": 1, "collage": "", "values": [{"value": "added: green/amber/red score coloring", "action": "added", "n_generated": 1, "n_original": 0, "sites": ["seoanalyzer_me"], "example": "AI-built colour-codes score values (green, amber, red); original shows score values without status colouring.", "sheets": []}]}, {"id": "COL007", "attribute": "text contrast", "summary": "A single page ends up with dark text on a dark ground that hides paragraphs.", "n_generated": 1, "n_diff": 1, "collage": "", "values": [{"value": "added: dark text on dark ground hides paragraphs", "action": "added", "n_generated": 1, "n_original": 0, "sites": ["kanienkeha_net"], "example": "Judge G saw dark paragraph text rendered on a dark ground, so the hero paragraph, the h3 labels, and the Map and Upload paragraphs were nearly invisible and left blank gaps above buttons.", "sheets": []}]}]}, {"family": "component", "summary": "AI-built pages generally rebuild original components into simpler, more uniform structures (slim solid bars, bordered card grids, two-column or centered bands, pill buttons and chips, plain text links) while dropping many popups, banners, sidebars, carousels, social icons and other secondary widgets, and keep y of it)\n- ADDED (not about any seed item): 66 of 133 (49%); of those on >= 2 sites: 49; of all attributes on >= 2 sites: 104\n- by family (is_item / property_of_item / none): color: 0/1/6; component: 26/12/18; copy: 5/3/10; decoration: 0/4/4; imagery: 2/2/7; layout: 2/3/4; other: 0/0/1; semantic_dom: 1/2/9; typography: 0/4/7\n\n## Seed items never matched (81): Breadcrumbs, Button group, Checkbox, Color picker, Combobox, Date input, Datepicker, Drawer, Dropdown menu, Empty state, Fieldset, File, File upload, Label, Popover, Progress bar, Progress indicator, Radio button, Rich text editor, Segmented control, Select, Skeleton, Slider, Spinner, Stack, Stepper, Text input, Textarea, Toast, Toggle, Tooltip, Tree view, Visually hidden, text, checkbox group, comment, listbox, feed, Pricing Sections, Bento Grids, Team Sections, Content Sections, Close button, Figure, Media object, Menu, Input group, Floating label, Box, Section, Level, Icon link, Focus ring, Scrollspy, Sticky, Drilldown menu, Accordion menu, 2D-Matrix Input Control, Anchor Link, Back-to-Top Button, Bottom Sheet, Contextual Menu, Control, Expandable Menu, Floating Button, Input Control, Input Stepper, Knob, Lightbox, Megamenu, Menu Bar, Overlay, Picker, Pie Menu, Popup Tip, Ribbon, Scrollbar, Split Button, State-Switch Control, Submenu, Wheel Picker\n\n## Added attributes seen on the most sites\n- color palette (color, 28 sites): Nearly every AI-built page changes the overall palette, most often to a navy/blue family, with teal/green, warm cream with orange or rust accents, and dark near-black schemes as the other common outcomes, and only one keeping the original brand palette.\n- copy tone (copy, 28 sites): Copy tone was either kept close to the original or flattened into short, plain, sentence-case, non-exclamatory and often third-person text, with no emoji or em dashes.\n- corner radius (decoration, 28 sites): Most AI-built pages change the original's square corners to small rounding (often with pill shapes on buttons or tags), while a few go to larger radii and only two keep square corners.\n- visual effects (decoration, 28 sites): The AI-built pages mostly reduce effects, with many original transitions cut back or removed and shadows or gradients swapped for flat styling and thin borders, though about a quarter keep an already minimal effect set and a few add header backdrop blur or other effects.\n- page layout (layout, 28 sites): Most AI-built pages move to a flex-plus-grid layout, replacing floats, flexbox-only or tables, and many collapse sidebar layouts into single-column or stacked full-width sections.\n- dom structure (semantic_dom, 28 sites): On nearly all sites the DOM is slimmed from heavy CMS, plugin or div-laden markup to minimal markup with few custom classes and a single inline stylesheet in place of many scripts and stylesheets.\n- heading hierarchy (semantic_dom, 28 sites): Almost all AI-built pages replace flat, irregular or empty heading outlines with a single-h1 structured hierarchy, most often h1–h3 and sometimes h1–h4, with only two sites keeping an out-of-order outline.\n- landmark elements (semantic_dom, 28 sites): Most AI-built pages swap generic divs for semantic landmarks (header, nav, main, sections, often footer or articles), while others consolidate repeated headers, navs and sections into single instances.\n- body typeface (typography, 28 sites): Body typefaces were replaced on every site, most commonly with a system-ui stack and otherwise with Georgia plus a sans pairing or a Helvetica stack.\n- image alt text (semantic_dom, 27 sites): The most common outcome is that missing, empty or generic alt text is replaced with descriptive alts, often with empty alts reserved for decorative images.\n- page metadata (semantic_dom, 27 sites): The dominant pattern is that rich social, JSON-LD and platform meta tags are cut to a minimal set, with titles shortened or simplified and empty lang attributes set to en.\n- body text size and line height (typography, 27 sites): Body text was almost always normalized to 16–17px with a 1.6–1.65 line height regardless of the original size or spacing.\n- section backgrounds (color, 23 sites): Most AI-built pages break the page into alternating full-width section bands, typically white or cream alternating with pale tints or dark navy/slate bands, replacing plain white or the original's differing banding.\n- page length (layout, 23 sites): Page height changes on most sites, most often with a very tall page becoming much shorter, while a smaller group becomes taller and a few lose empty gaps above the footer.\n- logo (imagery, 22 sites): Logos are most often shrunk or turned into styled text wordmarks, with a minority kept as the original image and a few repositioned.\n", "seed_name": "v1_3", "has_plot": true};const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
